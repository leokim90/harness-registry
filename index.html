<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하네스 · MCP 레지스트리</title>
<meta name="description" content="GitHub에 공개된 Claude Code 하네스와 MCP 서버를 매일 수집해 보여주는 레지스트리">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23B4661A'/><path d='M7 21.5 L16 9 L25 21.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EFF0F3; --panel:#FFFFFF; --panel-2:#F7F8FA;
  --ink:#15181E; --ink-2:#3D434F; --muted:#6A7183;
  --line:#DBDEE4; --line-2:#C7CBD4;
  --accent:#B4661A; --accent-ink:#8E4F12; --accent-soft:#F6E9DA;
  --clay:#9E4433; --focus:#B4661A;
  --shadow:0 1px 2px rgba(20,24,32,.06), 0 8px 24px rgba(20,24,32,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --panel:#1A1D23; --panel-2:#20242B;
    --ink:#E9EAEE; --ink-2:#C2C6CF; --muted:#8E96A5;
    --line:#282C34; --line-2:#363B45;
    --accent:#E39344; --accent-ink:#F0AC68; --accent-soft:#2A2117;
    --clay:#D57F6E; --focus:#E39344;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --panel:#1A1D23; --panel-2:#20242B;
  --ink:#E9EAEE; --ink-2:#C2C6CF; --muted:#8E96A5;
  --line:#282C34; --line-2:#363B45;
  --accent:#E39344; --accent-ink:#F0AC68; --accent-soft:#2A2117;
  --clay:#D57F6E; --focus:#E39344;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

header.top{border-bottom:1px solid var(--line);background:var(--panel)}
.top-inner{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between;padding:38px 0 26px}
.eyebrow{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 10px}
h1{margin:0;font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.15}
.lede{margin:12px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.meta-stamp{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--line-2)}

.stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line)}
.stat{flex:1 1 128px;padding:14px 16px;border-right:1px solid var(--line);text-align:left;transition:background .12s ease}
.stat:last-child{border-right:none}
.stat:hover{background:var(--panel-2)}
.stat[aria-pressed="true"]{background:var(--accent-soft)}
.stat .k{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.stat[aria-pressed="true"] .v{color:var(--accent-ink)}

.trend{border-top:1px solid var(--line);background:var(--panel-2)}
.trend-inner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 0}
.trend-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-right:4px}
.pill{border:1px solid var(--line-2);background:var(--panel);border-radius:99px;padding:5px 13px;
  font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.pill b{font-variant-numeric:tabular-nums;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pill[aria-pressed="true"] b{color:var(--accent-ink)}
.trend-note{font-size:12px;color:var(--muted)}

.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.toolbar-inner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:3px;padding:7px 11px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;background:none;border:none;outline:none;font:inherit;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--muted)}
select.ctl{background:var(--panel);border:1px solid var(--line-2);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer}
.toggle{border:1px solid var(--line-2);border-radius:3px;padding:7px 12px;background:var(--panel);
  font-size:13px;color:var(--ink-2);white-space:nowrap}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.count-line{padding:14px 0 4px;font-size:13px;color:var(--muted)}

/* 분류 안내 */
.guide{padding:16px 0 2px}
.guide-all{border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.guide-all>summary{cursor:pointer;padding:11px 15px;font-size:12.5px;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;gap:8px;font-weight:500}
.guide-all>summary::-webkit-details-marker{display:none}
.guide-all>summary::before{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--accent-ink);
  font-weight:600;width:10px}
.guide-all[open]>summary::before{content:"\2212"}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:0;background:var(--panel);border-top:1px solid var(--line)}
.gitem{padding:14px 15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gitem h4{margin:0 0 4px;font-size:13.5px;font-weight:600;display:flex;align-items:baseline;gap:7px}
.gitem h4 span{font-size:11.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.gitem p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.gitem p em{font-style:normal;color:var(--ink-2)}
.guide-one{border-left:2px solid var(--accent);background:var(--panel);padding:12px 16px;border-radius:0 3px 3px 0}
.guide-one h4{margin:0 0 3px;font-size:13.5px;font-weight:600}
.guide-one p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.guide-one p em{font-style:normal;color:var(--ink-2)}
.legend{padding:9px 0 0;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:8px 0 56px}
.card{position:relative;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;padding:16px 16px 13px;display:flex;flex-direction:column;gap:9px;
  transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease}
.card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.owner{font-size:11.5px;color:var(--muted)}
.repo{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
.stars{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.fav{font-size:14px;color:var(--line-2);padding:0 1px;line-height:1;transition:color .12s ease}
.fav:hover{color:var(--accent-ink)}
.fav[aria-pressed="true"]{color:var(--accent)}
.desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--accent-ink)}
.flag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:2px;
  background:var(--accent-soft);color:var(--accent-ink)}
.flag.up{background:none;color:var(--accent-ink);border:1px solid var(--accent);padding:0 5px}
.pulse{display:inline-flex;align-items:center;gap:5px}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.pulse.ok i{background:none;box-shadow:inset 0 0 0 1.5px var(--muted)}
.pulse.stale i{background:var(--clay)}
.empty,.loading{padding:60px 0;text-align:center;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);opacity:0;pointer-events:none;
  transition:opacity .18s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);
  border-left:1px solid var(--line);z-index:50;transform:translateX(102%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:translateX(0)}
.dr-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;
  justify-content:space-between;align-items:flex-start}
.dr-body{overflow-y:auto;padding:20px 24px 32px;display:flex;flex-direction:column;gap:22px}
.close{font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.close:hover{color:var(--ink)}
.sect h3{margin:0 0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sect p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.68}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:var(--muted);background:var(--panel-2)}
.cmd{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:var(--panel-2);margin-bottom:6px}
.cmd code{flex:1;padding:9px 11px;font-size:12.5px;overflow-x:auto;white-space:pre;color:var(--ink-2)}
.cmd button{border-left:1px solid var(--line);padding:0 13px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.cmd button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:3px;
  padding:9px 15px;font-size:13.5px;font-weight:500;text-decoration:none;background:var(--panel)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.gone-list{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.gone-list a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.gone-list a:hover{color:var(--accent-ink)}
footer.foot{border-top:1px solid var(--line);padding:24px 0 44px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:1fr}
  .stat{flex-basis:50%;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div>
        <p class="eyebrow">Open-source harness &amp; MCP registry</p>
        <h1>하네스 · MCP 레지스트리</h1>
        <p class="lede">GitHub에 공개된 Claude Code 하네스(스킬·서브에이전트·플러그인·오케스트레이션)와 MCP 서버를 매일 수집합니다. 카드를 누르면 요약·설치 명령·내려받기 링크가 열립니다.</p>
      </div>
      <div class="meta-stamp">
        <span class="mono" id="stamp">불러오는 중</span><span class="dot-sep"></span>
        <span><b class="num" id="totalN">—</b>개 저장소</span><span class="dot-sep"></span>
        <span>매일 09:00 KST 갱신</span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="trend"><div class="wrap trend-inner" id="trend" style="padding-left:0;padding-right:0"></div></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap toolbar-inner">
    <label class="search">
      <span class="mono" aria-hidden="true" style="color:var(--muted);font-size:13px">/</span>
      <input id="q" type="search" placeholder="이름 · 설명 · 토픽 검색" aria-label="검색">
    </label>
    <select class="ctl" id="sort" aria-label="정렬">
      <option value="stars">스타 많은 순</option>
      <option value="pushed">최근 커밋 순</option>
      <option value="name">이름 순</option>
    </select>
    <button class="toggle" id="tActive" aria-pressed="false">30일 내 활동만</button>
    <button class="toggle" id="tFav" aria-pressed="false">★ 즐겨찾기</button>
  </div>
</div>

<main class="wrap">
  <section class="guide" id="guide"></section>
  <p class="count-line" id="countLine"></p>
  <div class="grid" id="grid"><div class="loading">데이터를 불러오는 중…</div></div>
</main>

<footer class="foot">
  <div class="wrap" id="footNote"></div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" tabindex="-1">
  <div class="dr-head">
    <div>
      <div class="owner mono" id="drOwner"></div>
      <div class="repo" id="drTitle" style="font-size:19px"></div>
    </div>
    <button class="close" id="drClose" aria-label="닫기">✕</button>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<script>
(function(){
  const CATS = {
    mcp:'MCP 서버', 'awesome-mcp':'MCP 모음집', skills:'스킬', agents:'서브에이전트',
    plugins:'플러그인', harness:'하네스·오케스트레이션', awesome:'큐레이션 리스트'
  };
  const FRESH = {active:['활발','pulse'], ok:['보통','pulse ok'], stale:['정체','pulse stale']};
  // 분류마다 무엇이고 어떤 것들이 들어있는지. 용어를 모르는 사람 기준으로 씀.
  const CAT_DESC = {
    mcp: 'AI에 외부 기능을 붙이는 연결 모듈. 설치하면 AI가 직접 브라우저를 조작하거나 DB를 조회하거나 디자인 툴을 다룰 수 있게 됩니다. <em>예: playwright-mcp(브라우저 자동화), github-mcp-server(깃허브), blender-mcp(3D), figma-context-mcp(디자인)</em>',
    'awesome-mcp': 'MCP 서버를 용도별로 정리해 둔 목록 저장소. 필요한 서버를 찾을 때 여기부터 보면 됩니다. <em>예: awesome-mcp-servers</em>',
    skills: '특정 작업을 어떤 절차와 기준으로 할지 AI에게 가르치는 지침 묶음. 글쓰기·디자인·리서치 같은 작업의 결과 품질을 올립니다. <em>예: anthropics/skills(공식), agent-skills, 문서 작성·디자인 감각 교정 스킬</em>',
    agents: '역할이 정해진 보조 AI 정의. 코드 리뷰어, 보안 점검자처럼 역할을 쪼개 여러 개를 동시에 굴립니다. <em>예: 100종 이상 서브에이전트 모음집들</em>',
    plugins: '스킬·에이전트·명령어를 한 번에 설치하는 패키지. 마켓플레이스에서 골라 설치합니다. <em>예: claude-plugins-official(공식 디렉터리)</em>',
    harness: '여러 AI와 도구를 묶어 하나의 작업 흐름으로 돌리는 전체 구조. 개별 기능이 아니라 뼈대에 해당합니다. <em>예: 멀티 에이전트 오케스트레이션 프레임워크</em>',
    awesome: '위 항목들을 사람이 직접 골라 정리한 목록. 뭘 써야 할지 모를 때 출발점으로 좋습니다. <em>예: awesome-claude-code</em>'
  };
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const kfmt = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k' : String(n);
  const ago = d => d===0?'오늘':(d===1?'어제':(d<30?d+'일 전':(d<365?Math.floor(d/30)+'개월 전':Math.floor(d/365)+'년 전')));

  let REPOS=[], DELTAS={new:[],surging:[],gone:[],has_baseline:false}, surgeMap={}, newSet=new Set();
  let favs = new Set(store.get('reg.favs',[]));
  const state = { cat:'all', q:'', sort:'stars', activeOnly:false, favOnly:false, view:'all' };

  async function boot(){
    try{
      const bust = '?t=' + Math.floor(Date.now()/300000);   // 5분 단위 캐시 무효화
      const [cat, del] = await Promise.all([
        fetch('data/catalog.json'+bust).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('data/deltas.json'+bust).then(r=>r.ok?r.json():null).catch(()=>null)
      ]);
      REPOS = cat.repos;
      if(del) DELTAS = del;
      newSet = new Set(DELTAS.new||[]);
      (DELTAS.surging||[]).forEach(s => surgeMap[s.full_name]=s);
      $('#stamp').textContent = new Date(cat.generated).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
      $('#totalN').textContent = REPOS.length;
      $('#footNote').innerHTML = '수집 기준: GitHub 검색 API 26개 질의를 병합해 중복·무관 저장소를 걸러낸 목록입니다. '+
        '매일 09:00 KST에 자동 갱신되며, 스타·커밋 정보는 마지막 갱신 시점 값입니다. '+
        '<a href="https://github.com/leokim90/harness-registry" target="_blank" rel="noopener">수집 방식 보기</a>';
      buildStats(); buildTrend(); render();
    }catch(err){
      $('#grid').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.<br><span class="mono" style="font-size:12px">'+esc(err.message)+'</span></div>';
    }
  }

  function buildStats(){
    const counts = {all:REPOS.length};
    REPOS.forEach(r => counts[r.cat]=(counts[r.cat]||0)+1);
    $('#stats').innerHTML = ['all'].concat(Object.keys(CATS)).map(c =>
      '<button class="stat" data-cat="'+c+'" aria-pressed="'+(c==='all')+'">'+
      '<span class="k">'+(c==='all'?'전체':esc(CATS[c]))+'</span>'+
      '<span class="v num">'+(counts[c]||0)+'</span></button>').join('');
    $('#stats').addEventListener('click', e => {
      const b = e.target.closest('.stat'); if(!b) return;
      state.cat = b.dataset.cat;
      [...$('#stats').children].forEach(x => x.setAttribute('aria-pressed', String(x===b)));
      render();
    });
  }

  function buildTrend(){
    const t = $('#trend');
    if(!DELTAS.has_baseline && !(DELTAS.new||[]).length){
      t.innerHTML = '<span class="trend-label">동향</span><span class="trend-note">첫 수집 회차입니다. 다음 갱신부터 신규·급상승을 비교합니다.</span>';
      return;
    }
    const w = DELTAS.window_days || 7;
    t.innerHTML = '<span class="trend-label">동향</span>'+
      '<button class="pill" data-view="new" aria-pressed="false">신규 <b>'+(DELTAS.new||[]).length+'</b></button>'+
      '<button class="pill" data-view="surging" aria-pressed="false">급상승 <b>'+(DELTAS.surging||[]).length+'</b></button>'+
      '<button class="pill" id="goneBtn">사라짐 <b>'+(DELTAS.gone||[]).length+'</b></button>'+
      '<span class="trend-note">최근 '+w+'일 기준</span>';
    t.addEventListener('click', e => {
      const g = e.target.closest('#goneBtn');
      if(g){ openGone(); return; }
      const b = e.target.closest('[data-view]'); if(!b) return;
      state.view = state.view===b.dataset.view ? 'all' : b.dataset.view;
      t.querySelectorAll('[data-view]').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.view===state.view)));
      render();
    });
  }

  function renderGuide(){
    const g = document.getElementById('guide');
    if(state.cat !== 'all'){
      g.innerHTML = '<div class="guide-one"><h4>'+esc(CATS[state.cat])+'</h4><p>'+CAT_DESC[state.cat]+'</p></div>';
      return;
    }
    const counts = {};
    REPOS.forEach(r => counts[r.cat]=(counts[r.cat]||0)+1);
    const open = store.get('reg.guideOpen', true);
    g.innerHTML = '<details class="guide-all"'+(open?' open':'')+'>'+
      '<summary>분류 7가지가 각각 무엇인지</summary>'+
      '<div class="guide-grid">'+
        Object.keys(CATS).map(c => '<div class="gitem"><h4>'+esc(CATS[c])+
          ' <span>'+(counts[c]||0)+'개</span></h4><p>'+CAT_DESC[c]+'</p></div>').join('')+
      '</div></details>'+
      '<div class="legend">'+
        '<span><i style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:block"></i>활발 = 최근 30일 내 커밋</span>'+
        '<span><i style="width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);display:block"></i>보통 = 120일 내</span>'+
        '<span><i style="width:7px;height:7px;border-radius:50%;background:var(--clay);display:block"></i>정체 = 그 이상</span>'+
        '<span>숫자 = GitHub 스타 수</span>'+
      '</div>';
    g.querySelector('details').addEventListener('toggle', e =>
      store.set('reg.guideOpen', e.currentTarget.open));
  }

  function filtered(){
    const q = state.q.trim().toLowerCase();
    let list = REPOS.filter(r => {
      if(state.view==='new' && !newSet.has(r.full_name)) return false;
      if(state.view==='surging' && !surgeMap[r.full_name]) return false;
      if(state.cat!=='all' && r.cat!==state.cat) return false;
      if(state.activeOnly && r.fresh!=='active') return false;
      if(state.favOnly && !favs.has(r.full_name)) return false;
      if(!q) return true;
      return (r.full_name+' '+r.desc+' '+(r.topics||[]).join(' ')+' '+(r.lang||'')).toLowerCase().includes(q);
    });
    const s = state.sort;
    if(state.view==='surging'){
      list.sort((a,b)=> surgeMap[b.full_name].pct - surgeMap[a.full_name].pct);
    }else{
      list.sort((a,b) => s==='stars' ? b.stars-a.stars
        : s==='pushed' ? a.days_since_push-b.days_since_push
        : a.name.localeCompare(b.name));
    }
    return list;
  }

  function card(r){
    const f = FRESH[r.fresh], sg = surgeMap[r.full_name];
    return '<button class="card" data-id="'+esc(r.full_name)+'">'+
      '<div class="card-top"><div style="min-width:0">'+
        '<div class="owner mono">'+esc(r.owner)+'</div>'+
        '<div class="repo">'+esc(r.name)+'</div></div>'+
        '<div class="card-right">'+
          '<span class="fav" data-fav="'+esc(r.full_name)+'" role="button" tabindex="0" aria-pressed="'+favs.has(r.full_name)+'" aria-label="즐겨찾기">★</span>'+
          '<span class="stars">'+kfmt(r.stars)+'</span>'+
        '</div></div>'+
      '<div class="desc">'+esc(r.desc||'설명 없음')+'</div>'+
      '<div class="card-foot"><span class="tag">'+esc(CATS[r.cat]||r.cat)+'</span>'+
        (newSet.has(r.full_name)?'<span class="flag">NEW</span>':'')+
        (sg?'<span class="flag up">+'+sg.delta+' ★</span>':'')+
        (r.lang?'<span>'+esc(r.lang)+'</span>':'')+
        '<span class="'+f[1]+'" style="margin-left:auto"><i></i>'+f[0]+' · '+ago(r.days_since_push)+'</span>'+
      '</div></button>';
  }

  function render(){
    renderGuide();
    const list = filtered();
    const label = state.view==='new' ? ' · 신규만' : (state.view==='surging' ? ' · 급상승만' : '');
    $('#countLine').textContent = list.length + '개 표시' + label + (state.q?' · "'+state.q+'" 검색':'');
    $('#grid').innerHTML = list.length ? list.map(card).join('')
      : '<div class="empty">조건에 맞는 저장소가 없습니다.</div>';
  }

  let lastFocus = null;
  const cmdRow = c => '<div class="cmd"><code class="mono">'+esc(c)+'</code><button data-copy="'+esc(c)+'">복사</button></div>';

  function showDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').focus(); }

  function openGone(){
    lastFocus = document.activeElement;
    $('#drOwner').textContent = '동향';
    $('#drTitle').textContent = '목록에서 사라진 저장소';
    const g = DELTAS.gone || [];
    $('#drBody').innerHTML = '<div class="sect"><h3>설명</h3><p>직전 회차에는 있었지만 이번 수집에서 빠진 저장소입니다. 삭제·비공개 전환도 있지만, 다른 저장소가 더 올라와 카테고리 상한 밖으로 밀려난 경우가 대부분입니다.</p></div>'+
      (g.length ? '<div class="sect"><h3>'+g.length+'개</h3><div class="gone-list">'+
        g.map(x=>'<a href="https://github.com/'+esc(x.full_name)+'" target="_blank" rel="noopener">'+esc(x.full_name)+' <span class="num" style="color:var(--muted)">★'+x.stars+'</span></a>').join('')+
        '</div></div>' : '<div class="sect"><p>이번 회차에는 없습니다.</p></div>');
    showDrawer();
  }

  function open(id){
    const r = REPOS.find(x => x.full_name===id); if(!r) return;
    lastFocus = document.activeElement;
    $('#drOwner').textContent = r.owner + ' /';
    $('#drTitle').textContent = r.name;
    const f = FRESH[r.fresh], sg = surgeMap[r.full_name];
    let h = '';
    h += '<div class="sect"><h3>개요</h3><p>'+esc(r.desc||'설명이 없습니다.')+'</p></div>';
    if(r.summary) h += '<div class="sect"><h3>README 발췌</h3><p style="font-size:13.5px;color:var(--muted)">'+esc(r.summary)+'…</p></div>';
    h += '<div class="sect"><h3>지표</h3><dl class="kv">'+
      '<dt>분류</dt><dd>'+esc(CATS[r.cat]||r.cat)+(newSet.has(r.full_name)?' · <b>이번 회차 신규</b>':'')+'</dd>'+
      '<dt>스타</dt><dd>'+r.stars.toLocaleString()+' · 포크 '+r.forks.toLocaleString()+
        (sg?' · 최근 '+sg.span_days+'일 <b>+'+sg.delta+' ('+sg.pct+'%)</b>':'')+'</dd>'+
      '<dt>최근 커밋</dt><dd><span class="'+f[1]+'"><i></i>'+f[0]+'</span> · '+ago(r.days_since_push)+'</dd>'+
      '<dt>언어</dt><dd>'+esc(r.lang||'—')+'</dd>'+
      '<dt>라이선스</dt><dd>'+esc(r.license && r.license!=='NOASSERTION' ? r.license : '명시 없음')+'</dd>'+
      (r.archived?'<dt>상태</dt><dd style="color:var(--clay)">아카이브됨</dd>':'')+
      '</dl></div>';
    if(r.topics && r.topics.length)
      h += '<div class="sect"><h3>토픽</h3><div class="chips">'+r.topics.slice(0,14).map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>';
    h += '<div class="sect"><h3>가져오기</h3>'+cmdRow(r.clone)+
      (r.install && r.install.length ? '<div style="margin-top:10px"><h3 style="margin-bottom:9px">README에서 찾은 설치 명령</h3>'+r.install.map(cmdRow).join('')+'</div>' : '')+'</div>';
    h += '<div class="sect"><h3>열기</h3><div class="acts">'+
      '<a class="btn primary" href="'+esc(r.url)+'" target="_blank" rel="noopener">GitHub에서 보기</a>'+
      '<a class="btn" href="'+esc(r.zip)+'">ZIP 내려받기</a>'+
      (r.homepage?'<a class="btn" href="'+esc(r.homepage)+'" target="_blank" rel="noopener">홈페이지</a>':'')+
      '</div></div>';
    $('#drBody').innerHTML = h;
    showDrawer();
  }

  function close(){
    $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
    if(lastFocus) lastFocus.focus();
  }

  $('#grid').addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if(fav){
      e.stopPropagation();
      const id = fav.dataset.fav;
      if(favs.has(id)) favs.delete(id); else favs.add(id);
      store.set('reg.favs',[...favs]);
      fav.setAttribute('aria-pressed', String(favs.has(id)));
      if(state.favOnly) render();
      return;
    }
    const c = e.target.closest('.card'); if(c) open(c.dataset.id);
  });
  $('#drBody').addEventListener('click', async e => {
    const b = e.target.closest('[data-copy]'); if(!b) return;
    const txt = b.dataset.copy, old = b.textContent;
    try{ await navigator.clipboard.writeText(txt); }
    catch(err){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); }catch(e2){} t.remove(); }
    b.textContent='복사됨'; setTimeout(()=>{ b.textContent=old; },1200);
  });
  $('#drClose').addEventListener('click', close);
  $('#scrim').addEventListener('click', close);
  document.addEventListener('keydown', e => {
    if(e.key==='Escape') close();
    if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  });
  $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
  $('#tActive').addEventListener('click', e => {
    state.activeOnly = !state.activeOnly; e.currentTarget.setAttribute('aria-pressed', String(state.activeOnly)); render();
  });
  $('#tFav').addEventListener('click', e => {
    state.favOnly = !state.favOnly; e.currentTarget.setAttribute('aria-pressed', String(state.favOnly)); render();
  });

  boot();
})();
</script>
</body>
</html>
